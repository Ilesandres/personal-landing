<header class="sticky top-0 z-50 border-b border-border/60 bg-background/85 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6">
    <a routerLink="/" class="flex items-center gap-2 font-bold tracking-tight" aria-label="Inicio">
      <span class="grid h-9 w-9 place-items-center rounded-lg bg-primary font-mono text-base text-primary-foreground">AI</span>
      <span class="text-lg text-foreground">Andres<span class="text-accent">.</span>dev</span>
    </a>

    <nav class="hidden md:block" aria-label="Navegación principal">
      <ul class="flex items-center gap-1">
        @for (item of items; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              class="nav-link rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground"
            >{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="hidden items-center gap-3 md:flex">
      <a
        [href]="cvUrl"
        target="_blank"
        rel="noopener"
        class="inline-flex items-center rounded-full bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground shadow-[0_0_0_1px_var(--gray-a5)] transition-colors hover:bg-primary/90"
      >Descargar CV</a>
    </div>

    <button
      type="button"
      (click)="open = !open"
      [attr.aria-expanded]="open"
      [attr.aria-label]="open ? 'Cerrar menú' : 'Abrir menú'"
      class="inline-flex h-10 w-10 items-center justify-center rounded-md text-muted-foreground transition-colors hover:text-foreground md:hidden"
    >
      @if (open) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      }
    </button>
  </div>

  @if (open) {
    <nav class="border-t border-border/60 bg-background/95 px-4 pb-4 pt-2 md:hidden" aria-label="Navegación móvil">
      <ul class="space-y-1">
        @for (item of items; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              (click)="open = false"
              class="nav-link block rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground"
            >{{ item.label }}</a>
          </li>
        }
      </ul>
      <a
        [href]="cvUrl"
        target="_blank"
        rel="noopener"
        (click)="open = false"
        class="mt-3 flex items-center justify-center rounded-full bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90"
      >Descargar CV</a>
    </nav>
  }
</header>
